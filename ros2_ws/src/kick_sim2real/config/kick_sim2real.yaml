# kick_sim2real 部署配置（与 Machine-Dog 模板话题面对齐）
# 用法: ros2 launch kick_sim2real kick_sim2real.launch.py params:=$PWD/config/kick_sim2real.yaml

kick_sim2real:
  ros__parameters:
    # ---- 策略 -----------------------------------------------------------
    policy_ckpt: "/home/mi/kick_policy.pt"   # export 产物
    dry_run: true                            # 首次联调置 true

    # ---- 本体与输出后端 -------------------------------------------------
    dog_name: "gugugaga"       # 本机出厂命名空间（来历见 docs/SIM2REAL_INTERFACES.md §5）
    backend: "motion_servo"     # motion_servo | twist | lcm
    # motion_servo → protocol.msg/MotionServoCmd 到 /<dog>/motion_servo_cmd
    #                （出厂速度控制器；步态 303/308/305 自动选择）
    motion_servo_topic: ""      # 空 = /<dog_name>/motion_servo_cmd
    cmd_vel_topic: "/cmd_vel"   # backend=twist 时
    lcm_mode: 11                # backend=lcm 时（出厂运控直连兜底）
    lcm_gait_id: 26
    vel_limit: [1.6, 0.55, 2.5] # 与训练命令 ranges 一致

    # ---- 数据源选择（关键：关节反馈走只读 LCM） --------------------------
    # 高层接口（cyberdog_loco_cn §2）5 通道无关节反馈；spi_data（底层 7667）
    # 只读订阅即得 q/qd（不发布 motor_ctrl → 不切电机模式，安全）
    joint_source: "lcm_leg"        # lcm_leg(50Hz 常规模式) | lcm_spi(仅电机模式) | ros
    odom_source: "lcm_localization"  # ros | lcm_localization

    # ---- 输入话题（模板面） ---------------------------------------------
    joint_states_topic: "/joint_states"
    imu_topic: "/imu/data"
    odom_topic: ""                     # 空 = /<dog_name>/odom_out
    dog_pose_topic: ""                 # 空 = /absolute_pose/<dog_name>
    ball_pose_topic: "/absolute_pose/ball"
    estop_topic: "/kick_sim2real/estop"

    # ---- 位姿来源（方案A：全部取 VRPN 原始话题，天然同系） ----------------
    pose_source: "vrpn"        # vrpn（推荐）| absolute（模板 absolute_coordination 输出）
    dog_tracker: "GEXY2"       # 本机 VRPN tracker（cyberdog2-69 = GEXY2）
    ball_tracker: "ball"
    goal_source: "vrpn"        # vrpn（活跟踪门柱）| fixed（用 goal_center_xy）
    goal_tracker: "goal_left"  # 双门场地：选进攻那端（goal_left/goal_right）

    # ---- 坐标系规则（重要） ---------------------------------------------
    # obs 全为机体系相对量 → 只要 狗/球/门 同一世界系即可，全局平移+偏航自动抵消。
    # 方案A（推荐）：狗位姿也用 VRPN（/vrpn/<dog>/pose）→ 三个 offset 全 0。
    # 方案B（混源）：狗用 odom、球/门用动捕 → 必须做完整刚体变换（位置+四元数）：
    goal_center_xy: [0.0, 3.0]        # 世界系球门中心（实机为双门，需选进攻方向）
    odom_to_world_xy: [0.0, 0.0]      # odom→世界系平移（方案B；方案A留 0）
    odom_to_world_yaw: 0.0            # odom→世界系偏航（四元数会同步复合）
    mocap_frame_offset_xy: [0.0, 0.0] # 仅球与狗不同源时的球偏移（一般 0）
    mocap_yaw_offset: 0.0

    # ---- 频率与安全 -----------------------------------------------------
    control_hz: 50.0
    joint_timeout_s: 0.10
    odom_timeout_s: 0.25
    ball_timeout_s: 0.30
    last_action_source: "joint_deviation"   # zeros | joint_deviation
