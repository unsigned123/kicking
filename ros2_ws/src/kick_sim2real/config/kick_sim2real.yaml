# kick_sim2real 部署配置
# 用法: ros2 launch kick_sim2real kick_sim2real.launch.py params:=$PWD/config/kick_sim2real.yaml

kick_sim2real:
  ros__parameters:
    # ---- 策略 -----------------------------------------------------------
    policy_ckpt: "/home/user/kick_policy.pt"   # export 产物
    dry_run: true                              # 首次联调置 true：只打印命令

    # ---- 输出后端 -------------------------------------------------------
    backend: "twist"            # twist（ROS2 topic）| lcm（出厂运控直连）
    cmd_vel_topic: "/cmd_vel"   # backend=twist 时的发布话题
    lcm_mode: 11                # LOCOMOTION
    lcm_gait_id: 26             # TROT 自变频（10=FAST 3=MEDIUM 27=SLOW）
    vel_limit: [1.6, 0.55, 2.5] # 与训练命令 ranges 一致

    # ---- 输入话题 -------------------------------------------------------
    joint_states_topic: "/joint_states"
    imu_topic: "/imu/data"
    odom_topic: "/odom"
    ball_pose_topic: "/mocap/ball_pose"      # 动捕球位（PoseStamped）
    estop_topic: "/kick_sim2real/estop"      # std_msgs/Bool

    # ---- 场地标定 -------------------------------------------------------
    goal_center_xy: [0.0, 3.0]        # 世界系球门中心（与训练 GOAL_CENTER 语义同）
    mocap_frame_offset_xy: [0.0, 0.0] # 动捕系 → 里程计系 平移
    mocap_yaw_offset: 0.0             # 动捕系 → 里程计系 旋转（rad）

    # ---- 频率与安全 -----------------------------------------------------
    control_hz: 50.0
    joint_timeout_s: 0.10
    odom_timeout_s: 0.25
    ball_timeout_s: 0.30
    last_action_source: "joint_deviation"   # zeros | joint_deviation
